# TEST GIT CHANGE
local_backend: true

backend:
  name: github
  repo: NYSIPM/cornell-ipm-guidelines-demo
  branch: main
  # Route all GitHub API calls through our Auth0 role-gated proxy (a Netlify
  # function) instead of api.github.com. Relative path = same origin as /admin/,
  # so it works on the production domain and on Netlify deploy previews alike.
  # See netlify/functions/cms-git.mjs and the /cms-git redirect in netlify.toml.
  api_root: /cms-git

publish_mode: editorial_workflow
show_preview_links: true

media_folder: "static/images"
public_folder: "/static/images"

site_url: https://dancing-sundae-a531d3.netlify.app
display_url: https://dancing-sundae-a531d3.netlify.app

collections:
  # Naming convention for every guide: `name` and `folder` are the guide's
  # title in lowercase with hyphens for spaces (a short form for very long
  # titles, e.g. greenhouse). No capitals, spaces or numbers - Netlify's build
  # is case-sensitive and `name` appears in admin URLs. `label` is the title
  # as readers see it. Keep in sync with the home page cards (index.qmd), the
  # Publications menus (_quarto.yml files) and the image names in
  # static/images/guides/.

  # Berry Crops
  - name: "berry-crops"
    label: "Berry Crops"
    label_singular: "New Section"
    folder: "publications/berry-crops"
    # Images in this guide's own images/ folder. This guide is built as its own
    # Quarto project, where "/" in a page means the guide's folder, hence "/images".
    media_folder: "/publications/berry-crops/images"
    public_folder: "/images"
    create: true
    slug: "{{slug}}"
    extension: "qmd"
    format: "frontmatter"
    nested:
      depth: 2
      summary: "{{title}}"
    editor:
      preview: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      # - {label: "Subtitle", name: "subtitle", widget: "string", required: false}
      # - {label: "Chapter Number", name: "chapter", widget: "number", required: false, hint: "Optional ordering"}
      # - {label: "Authors", name: "authors", widget: "list", required: false, hint: "List of chapter authors"}
      # - {label: "Last Updated", name: "date", widget: "datetime", required: false}
      # NEW: left-panel tool widget (interactive)
      #- label: "API Table Tool"
      #  name: "api_tool"
      # widget: "apiFetchTool"
      #  required: false
      # Existing Body field (keep this)
      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: [rich_text, raw]
        editor_components:
          - image
          #- code-block
          - html-table-editor
          #- api-text
          - pesticide-table


  # Field Crops
  - name: "field-crops"
    label: "Field Crops"
    label_singular: "New Section"
    folder: "publications/field-crops"
    # Images in this guide's own images/ folder (see tree-fruit for details).
    media_folder: "/publications/field-crops/images"
    public_folder: "/publications/field-crops/images"
    create: true
    slug: "{{slug}}"
    extension: "qmd"
    format: "frontmatter"
    nested:
      depth: 2
      summary: "{{title}}"
      subfolders: false
    sortable_fields: ["order", "title"]
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Order", name: "order", widget: "number", value_type: "int"}
      - label: "Body"
        name: "body"
        widget: "markdown"


  # Grapes
  - name: "grapes"
    label: "Grapes"
    label_singular: "New Section"
    folder: "publications/grapes"
    # Images in this guide's own images/ folder. This guide is built as its own
    # Quarto project, where "/" in a page means the guide's folder, hence "/images".
    media_folder: "/publications/grapes/images"
    public_folder: "/images"
    create: true
    slug: "{{slug}}"
    extension: "qmd"
    format: "frontmatter"
    nested:
      depth: 2
      summary: "{{title}}"
    editor:
      preview: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "string", required: false}
      - {label: "Chapter Number", name: "chapter", widget: "number", required: false, hint: "Optional ordering"}
      - {label: "Authors", name: "authors", widget: "list", required: false, hint: "List of chapter authors"}
      - {label: "Last Updated", name: "date", widget: "datetime", required: false}
      - {label: "Body", name: "body", widget: "markdown"}


  # Greenhouse Floriculture and Herbaceous Ornamentals ("the greenhouse guide")
  - name: "greenhouse"
    label: "Greenhouse Floriculture and Herbaceous Ornamentals"
    label_singular: "New Section"
    folder: "publications/greenhouse"
    # Images in this guide's own images/ folder (see tree-fruit for details).
    media_folder: "/publications/greenhouse/images"
    public_folder: "/publications/greenhouse/images"
    create: true
    slug: "{{slug}}"
    extension: "qmd"
    format: "frontmatter"
    nested:
      depth: 2
      summary: "{{title}}"
    editor:
      preview: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "string", required: false}
      - {label: "Chapter Number", name: "chapter", widget: "number", required: false, hint: "Optional ordering"}
      - {label: "Authors", name: "authors", widget: "list", required: false, hint: "List of chapter authors"}
      - {label: "Last Updated", name: "date", widget: "datetime", required: false}
      - {label: "Body", name: "body", widget: "markdown"}


  # Hops
  - name: "hops"
    label: "Hops"
    label_singular: "New Section"
    folder: "publications/hops"
    # Images in this guide's own images/ folder (see tree-fruit for details).
    media_folder: "/publications/hops/images"
    public_folder: "/publications/hops/images"
    create: true
    slug: "{{slug}}"
    extension: "qmd"
    format: "frontmatter"
    nested:
      depth: 2
      summary: "{{title}}"
    editor:
      preview: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "string", required: false}
      - {label: "Chapter Number", name: "chapter", widget: "number", required: false, hint: "Optional ordering"}
      - {label: "Authors", name: "authors", widget: "list", required: false, hint: "List of chapter authors"}
      - {label: "Last Updated", name: "date", widget: "datetime", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
  

  # Tree Fruit
  - name: "tree-fruit"
    label: "Tree Fruit"
    label_singular: "New Section"
    folder: "publications/tree-fruit"
    # This guide's images live in its own images/ folder. media_folder is where
    # uploads are saved (leading "/" = from the repo root); public_folder is the
    # path written into pages. Tree Fruit is built by the root project, where
    # "/" in a page is the site root, so both are the full path.
    media_folder: "/publications/tree-fruit/images"
    public_folder: "/publications/tree-fruit/images"
    create: true
    slug: "{{slug}}"
    extension: "qmd"
    format: "frontmatter"
    nested:
      depth: 2
      summary: "{{title}}"
      subfolders: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - label: "Body"
        name: "body"
        widget: "markdown"

  # Trees and Shrubs
  - name: "trees-and-shrubs"
    label: "Trees and Shrubs"
    label_singular: "New Section"
    folder: "publications/trees-and-shrubs"
    # Images in this guide's own images/ folder (see tree-fruit for details).
    media_folder: "/publications/trees-and-shrubs/images"
    public_folder: "/publications/trees-and-shrubs/images"
    create: true
    slug: "{{slug}}"
    extension: "qmd"
    format: "frontmatter"
    nested:
      depth: 2
      summary: "{{title}}"
      subfolders: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}

  # Vegetable Crops
  - name: "vegetable-crops"
    label: "Vegetable Crops"
    label_singular: "New Section"
    folder: "publications/vegetable-crops"
    # Images in this guide's own images/ folder (see tree-fruit for details).
    media_folder: "/publications/vegetable-crops/images"
    public_folder: "/publications/vegetable-crops/images"
    create: true
    slug: "{{slug}}"
    extension: "qmd"
    format: "frontmatter"
    nested:
      depth: 2
      summary: "{{title}}"
      subfolders: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}

  # Organic Vegetable Crops
  - name: "organic-vegetable-crops"
    label: "Organic Vegetable Crops"
    label_singular: "New Section"
    folder: "publications/organic-vegetable-crops"
    # Images in this guide's own images/ folder. This guide is built as its own
    # Quarto project, where "/" in a page means the guide's folder, hence "/images".
    media_folder: "/publications/organic-vegetable-crops/images"
    public_folder: "/images"
    create: true
    slug: "{{slug}}"
    extension: "qmd"
    format: "frontmatter"
    nested:
      depth: 2
      summary: "{{title}}"
      subfolders: false
    sortable_fields: ["order", "title"]
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Order", name: "order", widget: "number", value_type: "int"}
      - label: "Body"
        name: "body"
        widget: "markdown"

  #I don't like this.
  - name: "decap-test"
    label: "Decap Test"
    folder: "publications/decap-test"
    create: true
    slug: "{{slug}}"
    extension: "qmd"
    format: "frontmatter"
    # Browse subfolders, e.g. _grapes-demo/ (the old Grapes demo/test pages)
    # and its chapter1/. Folders starting with "_" are never published by
    # Quarto, so they're a safe place to keep old or experimental pages.
    nested:
      depth: 3
      summary: "{{title}}"
      subfolders: false
    editor:
      preview: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: [rich_text, raw]
        editor_components:
          - pesticide-table
