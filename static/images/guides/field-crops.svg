<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 36 360 240" role="img" aria-label="Wheat in a field">
  <!-- Guide image set (static/images/guides/): drawn on a 480x320 canvas, framed to its central 360x240 (viewBox) so the subject fills small thumbnails. Soft background, pale halo, ground curve, one flat subject. -->
  <defs>
    <!-- One wheat ear, base at (0,0), pointing up -->
    <g id="wheat-ear">
      <path d="M0 0 L0 -170" stroke="#b9862a" stroke-width="6" stroke-linecap="round"/>
      <g fill="#e2b04a">
        <ellipse cx="-11" cy="-82" rx="9" ry="17" transform="rotate(-28 -11 -82)"/>
        <ellipse cx="11" cy="-82" rx="9" ry="17" transform="rotate(28 11 -82)"/>
        <ellipse cx="-11" cy="-104" rx="9" ry="17" transform="rotate(-28 -11 -104)"/>
        <ellipse cx="11" cy="-104" rx="9" ry="17" transform="rotate(28 11 -104)"/>
        <ellipse cx="-11" cy="-126" rx="9" ry="17" transform="rotate(-28 -11 -126)"/>
        <ellipse cx="11" cy="-126" rx="9" ry="17" transform="rotate(28 11 -126)"/>
        <ellipse cx="-10" cy="-148" rx="8" ry="15" transform="rotate(-28 -10 -148)"/>
        <ellipse cx="10" cy="-148" rx="8" ry="15" transform="rotate(28 10 -148)"/>
        <ellipse cx="0" cy="-170" rx="8" ry="16"/>
      </g>
      <path d="M0 -40 Q -26 -52 -38 -78" stroke="#8fb24a" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="480" height="320" fill="#fbf2dc"/>
  <circle cx="240" cy="165" r="128" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="240" cy="338" rx="320" ry="72" fill="#ead9a9"/>
  <!-- Field rows -->
  <g stroke="#d8c084" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M60 300 Q 240 268 420 300"/>
    <path d="M110 316 Q 240 292 370 316"/>
  </g>

  <use href="#wheat-ear" transform="translate(206 286) rotate(-14)"/>
  <use href="#wheat-ear" transform="translate(240 284) scale(1.08)"/>
  <use href="#wheat-ear" transform="translate(274 286) rotate(14) scale(-1 1)"/>
</svg>
