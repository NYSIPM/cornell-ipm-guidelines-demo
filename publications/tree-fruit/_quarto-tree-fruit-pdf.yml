project:
  type: book
  output-dir: _output

book:
  title: "Tree Fruit Guidelines"
  output-file: "tree-fruit-guidelines"

  # Add chapters here as they are written. The old test chapters
  # (1-1-test, 1-2-mac-muncher-applemunchus-voracious, test) were moved to
  # publications/decap-test/_tree-fruit-demo/ along with the PDF they made.
  chapters:
    - index.qmd

format:
  pdf:
    documentclass: scrbook
    toc: true
    number-sections: true
    shortcodes:
      - _extensions/pesticide-table/pesticide-table.lua
      - _extensions/pesticide-summary/pesticide-summary.lua
    header-includes:
      - |
        \usepackage{colortbl}
        \definecolor{TreatmentGray}{gray}{0.94}
    geometry:
      - top=0.5in
      - bottom=0.5in
      - left=0.5in
      - right=0.5in
    resource-path:
      - ../..