  navbar:
    left:
      # Site menu - same as the root _quarto.yml; keep in sync.
      # "/" = this guide's root (Quarto adds the right ../ per page), so /../../ = site root.
      - text: "Home"
        href: /../../index.html
      - text: "Publications"
        menu:
          - text: "Berry Crops"
            href: /../../publications/berry-crops/index.html
          - text: "Grapes"
            href: /../../publications/grapes/index.html
          - text: "Tree Fruit"
            href: /../../publications/tree-fruit/index.html
          - text: "---"
          - text: "Organic Vegetable Crops"
            href: /../../publications/organic-vegetable-crops/index.html
      - text: "About"
        href: /../../about.html

      - text: "Chapters"
        menu:
          - text: "Overview"
            href: index.qmd
          - text: "---"
          - text: "Asparagus"
            href: asparagus/index.qmd
          - text: "Beans — Dry, Snap, and Lima"
            href: beans/index.qmd
          - text: "Beets"
            href: beets/index.qmd
          - text: "Heading and Leafy Brassicas"
            href: brassicas/index.qmd
          - text: "Carrot"
            href: carrot/index.qmd
          - text: "Cucurbits"
            href: cucurbits/index.qmd
          - text: "Eggplant"
            href: eggplant/index.qmd
          - text: "Lettuce"
            href: lettuce/index.qmd
          - text: "Onion, Shallot, and Leek"
            href: onion/index.qmd
          - text: "Peas"
            href: peas/index.qmd
          - text: "Pepper"
            href: pepper/index.qmd
          - text: "Potato"
            href: potato/index.qmd
          - text: "Spinach"
            href: spinach/index.qmd
          - text: "Sweet Corn"
            href: sweet-corn/index.qmd
          - text: "Field Tomato"
            href: tomato/index.qmd
          - text: "Turnip, Rutabaga, Radish, and Kohlrabi"
            href: turnip/index.qmd

  # One sidebar for the whole guide, on every page: each crop is a chapter,
  # and crops split into sections (like Asparagus) expand to list them. It's
  # how readers move around inside this guide; the top menu's Publications
  # is for moving between guides. On phones it folds behind a menu button.
  sidebar:
    - id: organic-vegetable-crops
      title: "Organic Vegetable Crops"
      style: docked
      # Only the chapter you're in starts expanded; click a chapter to open it.
      collapse-level: 1
      contents:
        - text: "Overview"
          href: index.qmd
        # A crop split into sections: a folder with an index.qmd title page
        # (opened by clicking the chapter name). `contents: "<folder>/*.qmd"`
        # lists its pages automatically, sorted by each page's `order:` value -
        # nothing to update here when sections are added, renamed or
        # reordered in Decap. (Use the "/*.qmd" pattern, not the bare folder
        # name, which adds an extra nested level for the title page.)
        - section: "Asparagus"
          href: asparagus/index.qmd
          contents: "asparagus/*.qmd"
        - section: "Beans — Dry, Snap, and Lima"
          href: beans/index.qmd
          contents: "beans/*.qmd"
        - section: "Beets"
          href: beets/index.qmd
          contents: "beets/*.qmd"
        - section: "Heading and Leafy Brassicas"
          href: brassicas/index.qmd
          contents: "brassicas/*.qmd"
        - section: "Carrot"
          href: carrot/index.qmd
          contents: "carrot/*.qmd"
        - section: "Cucurbits"
          href: cucurbits/index.qmd
          contents: "cucurbits/*.qmd"
        - section: "Eggplant"
          href: eggplant/index.qmd
          contents: "eggplant/*.qmd"
        - section: "Lettuce"
          href: lettuce/index.qmd
          contents: "lettuce/*.qmd"
        - section: "Onion, Shallot, and Leek"
          href: onion/index.qmd
          contents: "onion/*.qmd"
        - section: "Peas"
          href: peas/index.qmd
          contents: "peas/*.qmd"
        - section: "Pepper"
          href: pepper/index.qmd
          contents: "pepper/*.qmd"
        - section: "Potato"
          href: potato/index.qmd
          contents: "potato/*.qmd"
        - section: "Spinach"
          href: spinach/index.qmd
          contents: "spinach/*.qmd"
        - section: "Sweet Corn"
          href: sweet-corn/index.qmd
          contents: "sweet-corn/*.qmd"
        - section: "Field Tomato"
          href: tomato/index.qmd
          contents: "tomato/*.qmd"
        - section: "Turnip, Rutabaga, Radish, and Kohlrabi"
