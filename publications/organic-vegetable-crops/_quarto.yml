  # Site footer - same as the root _quarto.yml; keep in sync. /../../ = site root (see navbar).
  page-footer:
    left: "© 2026 Cornell University · Cornell Integrated Pest Management (IPM)"
    right:
      - text: "About"
        href: /../../about.html
      - text: "Contact"
        href: /../../about.html#contact

format:
  html:
    theme: cosmo
    # Centres content next to the guide sidebar.
    css: crop-layout.css
    toc: true
    # The guide sidebar is on the left, so "On this page" goes on the right
    # (both on the left leaves the right-hand side of the page empty).
    toc-location: right
    toc-title: "On this page"
    # This folder is its own Quarto project, so the root _quarto.yml shortcodes
    # don't apply here. Point at the shared Lua files instead of copying them.
    shortcodes:
      - ../../filters/pesticide-table.lua
      - ../../filters/pesticide-summary.lua
    include-in-header:
      text: |
        <!-- Shared assets that populate the pesticide-table / pesticide-summary placeholders
             (docs/assets, copied by the root render). Pages sit at different depths (index.qmd
             at the top, chapters inside crop folders), so plain relative paths would break.
             Quarto rewrites a leading "/" to this guide's output root with the right number
             of ../ for each page, so "/../../assets" always lands on docs/assets. -->
        <!-- The module import below is inside a script, which Quarto doesn't rewrite, so it
             keeps the real site-absolute "/js/auth.js". -->
        <link rel="stylesheet" href="/../../assets/css/pesticide-summary-public.css">
        <link rel="stylesheet" href="/../../assets/css/public-treatment-builder.css">
        <script src="/../../assets/js/public-treatment-builder.js?v=3"></script>
        <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
        <!-- Load your existing auth file (as-is) -->
        <script src="/../../js/auth.js" defer></script>
        <!-- Must come after auth.js: deferred scripts run in order, and this one
             needs window.getTreatmentAccessToken as soon as it starts. -->
        <script src="/../../assets/js/public-pesticide-summary.js" defer></script>

        <!-- Bridge: expose functions globally no matter how auth.js is authored -->
        <script type="module">
          // If auth.js is an ES module, import it and attach its exports to window.
          try {
            const mod = await import("/js/auth.js");
            window.checkAuth ??= mod.checkAuth;
            window.login ??= mod.login;
            window.logout ??= mod.logout;
          } catch (e) {
            // Ignore: auth.js might not be a module (in that case it should define globals itself)
          }

          // If auth.js attaches under a namespace like window.auth, map it to globals.
          if (!window.checkAuth && window.auth?.checkAuth) window.checkAuth = window.auth.checkAuth;
          if (!window.login && window.auth?.login) window.login = window.auth.login;
          if (!window.logout && window.auth?.logout) window.logout = window.auth.logout;
        </script>

    include-after-body:
      text: |
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const navbarCollapse = document.querySelector('#navbarCollapse') || document.querySelector('.navbar-collapse');

            if (navbarCollapse) {
                const rightNav = document.createElement('ul');
                rightNav.className = 'navbar-nav ms-auto';

                const authStatusLi = document.createElement('li');
                authStatusLi.className = 'nav-item';
                authStatusLi.innerHTML = '<div id="auth-status" style="display:flex;align-items:center;"></div>';

                rightNav.appendChild(authStatusLi);
                navbarCollapse.appendChild(rightNav);

                setTimeout(updateNavAuthStatus, 100);
            }
        });

        async function updateNavAuthStatus() {
            const authStatusDiv = document.getElementById('auth-status');
            if (!authStatusDiv) return;

            try {
                const authStatus = await checkAuth();

                if (authStatus.authenticated) {
                    const email = authStatus.user?.email || 'User';
                    const displayName = email.split('@')[0];
                    authStatusDiv.innerHTML = `
                        <span style="color:#28a745;margin-right:10px;font-size:14px;">
                            ✓ ${displayName}
                        </span>
                        <button onclick="logout()"
                                style="background:#dc3545;color:white;border:none;
                                       padding:4px 12px;border-radius:4px;cursor:pointer;font-size:14px;">
                            Log Out
                        </button>
                    `;
                } else {
                    authStatusDiv.innerHTML = `
                        <button onclick="login()"
                                style="background:#B31B1B;color:white;border:none;
                                       padding:6px 16px;border-radius:4px;cursor:pointer;font-size:14px;">
                            Log In
                        </button>
                    `;
                }
            } catch (error) {
                console.error('Error updating nav auth status:', error);
                authStatusDiv.innerHTML = `
                    <button onclick="login()"
                            style="background:#B31B1B;color:white;border:none;
                                   padding:6px 16px;border-radius:4px;cursor:pointer;font-size:14px;">
                        Log In
                    </button>
                `;
            }
        }
        </script>
