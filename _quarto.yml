project:
  type: website
  output-dir: docs
  resources:
    - "admin/**"
    - "*.html"
    - "js/**"
    - "static/**"
    - "assets/**"
    # Each guide's images/ folder (Decap uploads), copied even before a page uses an image.
    - "publications/*/images/**"

filters:
  - filters/api-insert.lua
  - filters/pesticide-table.lua

execute:
  enabled: false

website:
  title: "Cornell IPM Guidelines (Demo)"
  # "<- previous / next ->" links at the bottom of each page, following the
  # sidebar order. Only pages with a sidebar (Tree Fruit) get them.
  page-navigation: true
  # Site menu. Each publication is its own Quarto project with its own
  # navbar (publications/*/_quarto.yml) - keep Home / Publications / About
  # in those in sync with this one.
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Publications"
        menu:
          - text: "Berry Crops"
            href: publications/berry-crops/index.html
          - text: "Grapes"
            href: publications/grapes/index.html
          - text: "Tree Fruit"
            href: publications/tree-fruit/index.html
          - text: "---"
          - text: "Organic Vegetable Crops"
            href: publications/organic-vegetable-crops/index.html
      - text: "About"
        href: about.qmd

  # Tree Fruit guide sidebar (Tree Fruit is built by this root project, so its
  # sidebar lives here). Only pages inside publications/tree-fruit/ get it.
  #
  # Chapter order = the order of the list below. Each chapter is its folder's
  # index.qmd (which gives the chapter its title), and the pages inside are
  # listed automatically by `contents: "<folder>/*.qmd"`, sorted by each
  # page's `order:` value (its position in the chapter; index.qmd is 0).
  # Nothing to update here when sections are added in Decap - only add a
  # chapter here when its folder gets an index.qmd.
  sidebar:
    - id: tree-fruit
      title: "Tree Fruit"
      style: docked
      collapse-level: 1
      contents:
        - text: "Overview"
          href: publications/tree-fruit/index.qmd
        - section: publications/tree-fruit/00-organization-of-this-publication/index.qmd
          contents: "publications/tree-fruit/00-organization-of-this-publication/*.qmd"
        - section: publications/tree-fruit/01-integrated-crop-and-pest-management/index.qmd
          contents: "publications/tree-fruit/01-integrated-crop-and-pest-management/*.qmd"
        - section: publications/tree-fruit/02-organic-tree-fruit-production-in-new-york-state/index.qmd
          contents: "publications/tree-fruit/02-organic-tree-fruit-production-in-new-york-state/*.qmd"
        - section: publications/tree-fruit/03-pesticide-information/index.qmd
          contents: "publications/tree-fruit/03-pesticide-information/*.qmd"
        - section: publications/tree-fruit/04-sprayer-information/index.qmd
          contents: "publications/tree-fruit/04-sprayer-information/*.qmd"
        - section: publications/tree-fruit/05-characteristics-of-crop-protectants-used-on-tree-fruits/index.qmd
          contents: "publications/tree-fruit/05-characteristics-of-crop-protectants-used-on-tree-fruits/*.qmd"
        - section: publications/tree-fruit/06-disease-management/index.qmd
          contents: "publications/tree-fruit/06-disease-management/*.qmd"
        # 07-insect-and-mite-management, 08-weed-management,
        # 09-wildlife-damage-management, 10-nutrient-management-of-apple-orchards:
        # add here (same two lines) once each has an index.qmd. Keep chapter
        # folders zero-padded (12-, not 1-2) so Decap's folder tree, which
        # sorts names as text, lists them in order.
        - section: publications/tree-fruit/11-apples/index.qmd
          contents: "publications/tree-fruit/11-apples/*.qmd"

  # Site footer - also in each publication's _quarto.yml; keep in sync.
  page-footer:
    left: "Cornell IPM"
    right:
      - text: "About"
        href: about.qmd
      - text: "Contact"
        href: about.qmd#contact

format:
  html:
    css:
      - assets/css/pesticide-summary-public.css
      - assets/css/public-treatment-builder.css
      # Centres content next to the Tree Fruit sidebar (sidebar pages only).
      - assets/css/guide-sidebar-layout.css
    theme: cosmo
    html-math-method: katex
    toc: true
    shortcodes:
      - filters/pesticide-table.lua #Part of the public table viewer.
      - filters/pesticide-summary.lua
    include-in-header:
      text: |
        <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
        <script src="/js/auth.js"></script>

        <script src="/assets/js/public-treatment-builder.js?v=3"></script>

        
        <!--<link rel="stylesheet" href="/assets/css/public-treatment-builder.css">-->
        <!--<link rel="stylesheet" href="/assets/css/pesticide-table.css">-->

    include-after-body:
      text: |
        <script src="/assets/js/public-pesticide-summary.js"></script>
        
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Find the navbar container
            const navbarCollapse = document.querySelector('#navbarCollapse') || document.querySelector('.navbar-collapse');
            
            if (navbarCollapse) {
                // Create a new navbar-nav for the right side
                const rightNav = document.createElement('ul');
                rightNav.className = 'navbar-nav ms-auto';
                
                const authStatusLi = document.createElement('li');
                authStatusLi.className = 'nav-item';
                authStatusLi.innerHTML = '<div id="auth-status" style="display: flex; align-items: center;"></div>';
                
                rightNav.appendChild(authStatusLi);
                navbarCollapse.appendChild(rightNav);
                
                // Update status
                setTimeout(updateNavAuthStatus, 100);
            }
        });
        
        async function updateNavAuthStatus() {
            const authStatusDiv = document.getElementById('auth-status');
            if (!authStatusDiv) return;
            
            try {
                const authStatus = await checkAuth();
                
                if (authStatus.authenticated) {
                    const email = authStatus.user?.email || 'User';
                    const displayName = email.split('@')[0];
                    authStatusDiv.innerHTML = `
                        <span style="color: #28a745; margin-right: 10px; font-size: 14px;">
                            ✓ ${displayName}
                        </span>
                        <button onclick="logout()" 
                                style="background: #dc3545; color: white; border: none; 
                                       padding: 4px 12px; border-radius: 4px; cursor: pointer; 
                                       font-size: 14px;">
                            Log Out
                        </button>
                    `;
                } else {
                    authStatusDiv.innerHTML = `
                        <button onclick="login()" 
                                style="background: #B31B1B; color: white; border: none; 
                                       padding: 6px 16px; border-radius: 4px; cursor: pointer; 
                                       font-size: 14px;">
                            Log In
                        </button>
                    `;
                }
            } catch (error) {
                console.error('Error updating nav auth status:', error);
                authStatusDiv.innerHTML = `
                    <button onclick="login()" 
                            style="background: #B31B1B; color: white; border: none; 
                                   padding: 6px 16px; border-radius: 4px; cursor: pointer; 
                                   font-size: 14px;">
                        Log In
                    </button>
                `;
            }
        }
        </script>